name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      # v5 targets Node 24. v4 targeted Node 20, which GitHub has deprecated and
      # was force-running on Node 24 anyway, producing a warning on every run.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches local development. Node 24 ships npm 11.
          node-version: 24
          cache: npm

      # npm 10 and npm 11 disagree about how to resolve an OPTIONAL PEER
      # dependency, and that disagreement silently breaks `npm ci`:
      #
      #   next        pins @swc/helpers to exactly 0.5.15
      #   @swc/core   (via next-intl) wants @swc/helpers >=0.5.17, optional peer
      #
      # npm 11 treats the unsatisfiable optional peer as skippable and writes no
      # nested entry. npm 10 resolves it, expects a nested @swc/helpers@0.5.23,
      # does not find it in the lockfile, and fails with EUSAGE — which is what
      # broke every run of this workflow up to and including CI #9.
      #
      # Pinning npm explicitly means CI resolves the lockfile exactly as a
      # developer does, rather than depending on whichever npm the Node release
      # happens to bundle. If you change this, make sure `npm ci` still passes
      # on a clean checkout.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # A key present in en but missing from fr renders the raw key path to a
      # visitor rather than failing the build, so it has to be caught here.
      - name: Check message catalogues are in sync
        run: npm run check:messages

      # Generated per run rather than written as a literal. The build does not
      # need it today — the portal is force-dynamic, so nothing auth-related is
      # prerendered and the build passes without it (verified) — but having one
      # means a future change that evaluates auth() during prerendering fails on
      # the real problem instead of a confusing missing-secret error.
      #
      # Generated, not hardcoded, because a secret-shaped literal in a public
      # repository is exactly what secret scanners flag, and rightly: the next
      # person to need one copies whatever is already there.
      - name: Generate a throwaway build secret
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
