name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      # v5 targets Node 24. v4 targeted Node 20, which GitHub has deprecated and
      # was force-running on Node 24 anyway, producing a warning on every run.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches local development. Node 24 ships npm 11.
          node-version: 24
          cache: npm

      # npm 10 and npm 11 disagree about how to resolve an OPTIONAL PEER
      # dependency, and that disagreement silently breaks `npm ci`:
      #
      #   next        pins @swc/helpers to exactly 0.5.15
      #   @swc/core   (via next-intl) wants @swc/helpers >=0.5.17, optional peer
      #
      # npm 11 treats the unsatisfiable optional peer as skippable and writes no
      # nested entry. npm 10 resolves it, expects a nested @swc/helpers@0.5.23,
      # does not find it in the lockfile, and fails with EUSAGE — which is what
      # broke every run of this workflow up to and including CI #9.
      #
      # Pinning npm explicitly means CI resolves the lockfile exactly as a
      # developer does, rather than depending on whichever npm the Node release
      # happens to bundle. If you change this, make sure `npm ci` still passes
      # on a clean checkout.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # A key present in en but missing from fr renders the raw key path to a
      # visitor rather than failing the build, so it has to be caught here.
      - name: Check message catalogues are in sync
        run: npm run check:messages

      # Checks the design system itself, not just the pages Lighthouse happens
      # to visit, so a token reused somewhere new cannot quietly drop below AA.
      - name: Check colour contrast
        run: npm run check:contrast

      # Generated per run rather than written as a literal. The build does not
      # need it today — the portal is force-dynamic, so nothing auth-related is
      # prerendered and the build passes without it (verified) — but having one
      # means a future change that evaluates auth() during prerendering fails on
      # the real problem instead of a confusing missing-secret error.
      #
      # Generated, not hardcoded, because a secret-shaped literal in a public
      # repository is exactly what secret scanners flag, and rightly: the next
      # person to need one copies whatever is already there.
      - name: Generate a throwaway build secret
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

  # Separate job: this one needs a built app and a running server, and takes
  # minutes rather than seconds. Keeping it apart means a typo still fails fast
  # in the job above.
  audit:
    name: Performance & accessibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Generate a throwaway build secret
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      # nohup + disown so the server survives the end of this step's shell.
      # lighthouserc.json deliberately has no startServerCommand: one server is
      # started here and shared by every check below, rather than lhci racing
      # this one for port 3000.
      - name: Start server
        run: |
          nohup npm run start > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/en > /dev/null && echo "server ready" && exit 0
            sleep 2
          done
          echo "server did not become ready"; cat /tmp/server.log; exit 1

      # Structural checks across every page in both locales: one h1, no skipped
      # heading levels, alt text, labelled form fields, landmarks, link names.
      - name: Structural accessibility audit
        run: npm run check:a11y

      # Reports what is still outstanding rather than gating on it — these are
      # expected to be unresolved before launch.
      - name: Outstanding placeholders
        run: npm run check:placeholders

      # Accessibility and best-practices are asserted as errors because they
      # measured a solid 100 on every page. Performance is a warning, not an
      # error: Lighthouse's simulated Speed Index is noisy on shared CI runners
      # and a flaky red build teaches people to ignore the build.
      - name: Lighthouse
        run: npx lhci autorun --config=lighthouserc.json
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}
